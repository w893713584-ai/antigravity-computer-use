name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build Native & Run Tests (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build native helpers
        run: npm run build:native

      - name: Run unit tests
        run: npm test

      - name: Verify share package build
        run: npm run pack-share
